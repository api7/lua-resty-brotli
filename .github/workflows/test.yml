name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit luarocks brotli
      - name: Install rock and verify wire compatibility
        run: |
          luarocks lint ./*.rockspec
          luarocks --lua-version=5.1 make --tree="$RUNNER_TEMP/rocks"
          LUA_PATH="$RUNNER_TEMP/rocks/share/lua/5.1/?.lua;;" ./test/run.sh
